<!-- The full uxproof lockup: tile + wordmark. The app composes these two
     separately (tile as SVG, wordmark as HTML text) so the type matches the
     interface; this file is the canonical artwork for anywhere that needs
     the lockup as one asset — docs, README, exports. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 56" width="220" height="56" fill="none">
  <rect width="56" height="56" rx="12" fill="#7E27FE"/>
  <g transform="translate(3.3,3.3) scale(1.9)">
    <rect x="4" y="4.6" width="17.7" height="2.1" rx="1.05" fill="#FFFFFF"/>
    <rect x="4" y="10.6" width="5.6" height="2.1" rx="1.05" fill="#FFFFFF"/>
    <rect x="4" y="16.6" width="5.6" height="2.1" rx="1.05" fill="#FFFFFF"/>
    <circle cx="16" cy="14.5" r="4.9" stroke="#FFFFFF" stroke-width="2"/>
    <line x1="19.47" y1="17.97" x2="22" y2="21.4" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
  </g>
  <text x="72" y="28" dominant-baseline="central" font-size="34" letter-spacing="-0.3"
        font-family="'Schibsted Grotesk','Archivo','Helvetica Neue',Arial,sans-serif">
    <tspan font-weight="800" fill="#7E27FE">ux</tspan><tspan font-weight="400" fill="#111113">proof</tspan>
  </text>
</svg>
